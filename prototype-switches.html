<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm (FM) — CTC Dispatch Schematic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #161616; overflow: hidden; height: 100vh; width: 100vw; }
  svg { width: 100%; height: 100%; display: block; }
  .trk { stroke: #999; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .trk-main { stroke: #b0b0b0; stroke-width: 3; }
  .trk-yard { stroke: #888; stroke-width: 2; }
  .trk-dim { stroke: #333; }
  .jdot { fill: #c0c0c0; cursor: pointer; }
  .jdot:hover { fill: #fff; }
  .lbl { fill: #888; font: 700 11px 'Consolas','Monaco',monospace; }
  .lbl-sm { fill: #555; font: 600 8px 'Consolas','Monaco',monospace; }
  .lbl-title { fill: #999; font: 700 14px 'Consolas','Monaco',monospace; letter-spacing: 1px; }
  .lbl-sub { fill: #555; font: 600 10px 'Consolas','Monaco',monospace; }
  .dash { stroke-dasharray: 8 6; }
  .title-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 24px;
    background: #0c0c0c; border-bottom: 1px solid #222;
    display: flex; align-items: center; padding: 0 16px;
    font: 10px 'Consolas','Monaco',monospace; color: #555;
    letter-spacing: 1px; text-transform: uppercase; z-index: 10;
  }
  #info {
    position: fixed; bottom: 0; left: 0; right: 0; height: 26px;
    background: #0c0c0c; border-top: 1px solid #222;
    display: flex; align-items: center; padding: 0 16px;
    font: 10px 'Consolas','Monaco',monospace; color: #555; gap: 20px; z-index: 10;
  }
  #info .v { color: #999; font-weight: 700; }
</style>
</head>
<body>
<div class="title-bar">Farm (FM) — CTC Station Schematic — Prototype</div>

<svg id="map" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="600" fill="#161616"/>

  <!-- ==========================================================
       FARM (FM) STATION SCHEMATIC
       Based on official PDF pages 20-21 and track_data.json
       
       Layout from schematic PDF:
       - Main line runs upper-left to upper-right (A-03-L)
       - A triangular loop drops down from the main line
       - Left branch diverges down-left from main
       - Bottom of loop has loading tracks (A-01-L, A-02-S)
       - Right side rejoins main line
       - Transfer Yard B is in the upper area (7 parallel tracks)
       - Tracks: B-07-P, B-06-O, B-05-O, (through), B-03-S, B-02-I, B-01-S
       ========================================================== -->

  <!-- === MAIN LINE (A-03-L) — runs across the top === -->
  <!-- Dashed entry from left (to OWC) -->
  <line class="trk trk-main dash" x1="30" y1="200" x2="130" y2="200"/>
  <!-- Main line through station -->
  <line class="trk trk-main" x1="130" y1="200" x2="870" y2="200"/>
  <!-- Dashed exit right (to OR/FRC) -->
  <line class="trk trk-main dash" x1="870" y1="200" x2="970" y2="200"/>

  <!-- === LEFT BRANCH (diverges down-left from main) === -->
  <!-- J-155 area: main branches down -->
  <line class="trk" x1="200" y1="200" x2="150" y2="260"/>
  <!-- Down to lower junction cluster -->
  <line class="trk" x1="150" y1="260" x2="180" y2="350"/>

  <!-- === BOTTOM TRACKS (A-01-L, A-02-S) === -->
  <!-- A-01-L loading track -->
  <line class="trk trk-yard" x1="180" y1="350" x2="530" y2="350"/>
  <!-- A-02-S siding -->
  <line class="trk trk-yard" x1="180" y1="380" x2="530" y2="380"/>

  <!-- Track labels for A tracks -->
  <text class="lbl" x="350" y="344">A-01-L</text>
  <text class="lbl-sm" x="350" y="376">A-02-S</text>

  <!-- === RIGHT BRANCH (rejoins main from below) === -->
  <line class="trk" x1="530" y1="350" x2="750" y2="200"/>
  <line class="trk" x1="530" y1="380" x2="720" y2="200"/>

  <!-- === DASHED EXIT SOUTH (to SW) === -->
  <line class="trk dash" x1="870" y1="200" x2="870" y2="280"/>
  <line class="trk dash" x1="870" y1="280" x2="870" y2="350"/>

  <!-- === TRANSFER YARD B (7 parallel tracks in upper area) === -->
  <!-- Left fan-out from junction cluster around x=250 -->
  <!-- Track B-07-P (topmost yard track) -->
  <line class="trk trk-yard" x1="280" y1="200" x2="250" y2="100"/>
  <line class="trk trk-yard" x1="250" y1="100" x2="650" y2="100"/>
  <line class="trk trk-yard" x1="650" y1="100" x2="680" y2="200"/>

  <!-- Track B-06-O -->
  <line class="trk trk-yard" x1="300" y1="200" x2="280" y2="120"/>
  <line class="trk trk-yard" x1="280" y1="120" x2="630" y2="120"/>
  <line class="trk trk-yard" x1="630" y1="120" x2="660" y2="200"/>

  <!-- Track B-05-O -->
  <line class="trk trk-yard" x1="320" y1="200" x2="310" y2="140"/>
  <line class="trk trk-yard" x1="310" y1="140" x2="610" y2="140"/>
  <line class="trk trk-yard" x1="610" y1="140" x2="640" y2="200"/>

  <!-- (Through track = main line already drawn) -->

  <!-- Track B-03-S -->
  <line class="trk trk-yard" x1="350" y1="200" x2="380" y2="240"/>
  <line class="trk trk-yard" x1="380" y1="240" x2="560" y2="240"/>
  <line class="trk trk-yard" x1="560" y1="240" x2="600" y2="200"/>

  <!-- Track B-02-I -->
  <line class="trk trk-yard" x1="370" y1="200" x2="400" y2="260"/>
  <line class="trk trk-yard" x1="400" y1="260" x2="540" y2="260"/>
  <line class="trk trk-yard" x1="540" y1="260" x2="580" y2="200"/>

  <!-- Track B-01-S -->
  <line class="trk trk-yard" x1="390" y1="200" x2="420" y2="280"/>
  <line class="trk trk-yard" x1="420" y1="280" x2="520" y2="280"/>
  <line class="trk trk-yard" x1="520" y1="280" x2="560" y2="200"/>

  <!-- === YARD TRACK LABELS === -->
  <text class="lbl-sm" x="440" y="96">B-07-P</text>
  <text class="lbl-sm" x="440" y="116">B-06-O</text>
  <text class="lbl-sm" x="440" y="136">B-05-O</text>
  <text class="lbl-sm" x="440" y="196" fill="#666">through</text>
  <text class="lbl-sm" x="460" y="236">B-03-S</text>
  <text class="lbl-sm" x="460" y="256">B-02-I</text>
  <text class="lbl-sm" x="460" y="276">B-01-S</text>

  <!-- === JUNCTION TRIANGLES === -->
  <!-- Each triangle is at a turnout point, pointing along selected route -->

  <!-- J at x=200 (left main/branch split) -->
  <g class="jdot" transform="rotate(0, 200, 200)">
    <polygon points="210,200 195,194 195,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=280 (B-07 entry left) -->
  <g class="jdot" transform="rotate(0, 280, 200)">
    <polygon points="290,200 275,194 275,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=300 (B-06 entry left) -->
  <g class="jdot" transform="rotate(0, 300, 200)">
    <polygon points="310,200 295,194 295,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=320 (B-05 entry left) -->
  <g class="jdot" transform="rotate(0, 320, 200)">
    <polygon points="330,200 315,194 315,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=350 (B-03 entry left) -->
  <g class="jdot" transform="rotate(0, 350, 200)">
    <polygon points="360,200 345,194 345,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=370 (B-02 entry left) -->
  <g class="jdot" transform="rotate(0, 370, 200)">
    <polygon points="380,200 365,194 365,206" fill="#b0b0b0"/>
  </g>

  <!-- J at x=390 (B-01 entry left) -->
  <g class="jdot" transform="rotate(0, 390, 200)">
    <polygon points="400,200 385,194 385,206" fill="#b0b0b0"/>
  </g>

  <!-- Right side junctions (yard exit) -->
  <g class="jdot" transform="rotate(180, 560, 200)">
    <polygon points="570,200 555,194 555,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(180, 580, 200)">
    <polygon points="590,200 575,194 575,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(180, 600, 200)">
    <polygon points="610,200 595,194 595,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(180, 640, 200)">
    <polygon points="650,200 635,194 635,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(180, 660, 200)">
    <polygon points="670,200 655,194 655,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(180, 680, 200)">
    <polygon points="690,200 675,194 675,206" fill="#b0b0b0"/>
  </g>

  <!-- Bottom area junctions -->
  <g class="jdot" transform="rotate(120, 150, 260)">
    <polygon points="160,260 145,254 145,266" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(-45, 750, 200)">
    <polygon points="760,200 745,194 745,206" fill="#b0b0b0"/>
  </g>
  <g class="jdot" transform="rotate(-30, 720, 200)">
    <polygon points="730,200 715,194 715,206" fill="#b0b0b0"/>
  </g>

  <!-- Right exit junction (to SW) -->
  <g class="jdot" transform="rotate(90, 870, 200)">
    <polygon points="880,200 865,194 865,206" fill="#b0b0b0"/>
  </g>

  <!-- === STATION LABELS === -->
  <text class="lbl-title" x="500" y="50" text-anchor="middle">FARM</text>
  <text class="lbl-sub" x="500" y="66" text-anchor="middle">FM</text>

  <!-- Exit labels -->
  <text class="lbl-sm" x="40" y="192">to OWC</text>
  <text class="lbl-sm" x="910" y="192">to FRC/OR</text>
  <text class="lbl-sm" x="880" y="370">to SW</text>

  <!-- Yard section labels -->
  <text class="lbl" x="80" y="420" fill="#666">A</text>
  <text class="lbl" x="440" y="80" fill="#666">B — Transfer Yard</text>

  <!-- Water tower icon (simplified) -->
  <circle cx="160" cy="395" r="6" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <text class="lbl-sm" x="170" y="399" fill="#4a9eff">W</text>

  <!-- Station office icon -->
  <rect x="440" y="82" width="10" height="10" rx="1" fill="none" stroke="#e8a832" stroke-width="1"/>

</svg>

<div id="info">
  <span>STATION: <span class="v">Farm (FM)</span></span>
  <span>JUNCTIONS: <span class="v">17</span></span>
  <span>TRACKS: A-01-L, A-02-S, A-03-L, B-01 to B-07</span>
</div>

</body>
</html>
