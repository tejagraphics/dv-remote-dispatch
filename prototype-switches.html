<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm (FM) — Raw vs Schematic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #161616; color: #999; font-family: 'Consolas','Monaco',monospace; overflow: auto; }
  h1 { text-align: center; font-size: 13px; color: #666; letter-spacing: 2px; text-transform: uppercase; padding: 12px 0 4px; }
  .sub { text-align: center; font-size: 10px; color: #444; margin-bottom: 16px; }
  .panels { display: flex; gap: 8px; padding: 0 8px 8px; height: calc(100vh - 60px); }
  .panel { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 3px; position: relative; overflow: hidden; }
  .panel-title { position: absolute; top: 6px; left: 10px; font-size: 10px; color: #555; letter-spacing: 1px; text-transform: uppercase; z-index: 2; }
  svg { width: 100%; height: 100%; }
  .trk { stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .jdot { r: 3; }
  .jlbl { font-size: 7px; fill: #666; }
  .tlbl { font-size: 8px; fill: #777; font-weight: 700; }
  .exit-lbl { font-size: 7px; fill: #555; }
</style>
</head>
<body>

<h1>Farm (FM) — Raw Geometry vs Generated Schematic</h1>
<p class="sub">Left: actual game coordinates · Right: schematic layout engine output · Same graph, same connectivity</p>

<div class="panels">
  <div class="panel">
    <div class="panel-title">Raw Geometry (from track_data.json)</div>
    <svg id="raw" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
      <rect width="800" height="600" fill="#1a1a1a"/>
    </svg>
  </div>
  <div class="panel">
    <div class="panel-title">Generated Schematic (same topology)</div>
    <svg id="sch" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
      <rect width="800" height="600" fill="#161616"/>
    </svg>
  </div>
</div>

<script>
// ============================================================
// FARM (FM) GRAPH DATA
// Extracted from track_data.json — topology only
// ============================================================

// Junctions: id → {x, z, links}
// x,z are raw game coordinates (used for the left panel)
const junctions = {
  151: { x: 5872, z: 6611, links: [153, 152] },
  152: { x: 6138, z: 6848, links: [154, 151] },
  153: { x: 5850, z: 6585, links: [155, 151, 154] },
  154: { x: 6166, z: 6867, links: [156, 152, 153] },
  155: { x: 5826, z: 6560, links: [347, 153, 161] },
  156: { x: 6194, z: 6887, links: [162, 154, 161] },
  157: { x: 5906, z: 6621, links: [159, 158] },
  158: { x: 6172, z: 6858, links: [160, 157] },
  159: { x: 5878, z: 6601, links: [161, 157, 160] },
  160: { x: 6195, z: 6883, links: [162, 158, 159] },
  161: { x: 5850, z: 6581, links: [155, 159, 156] },
  162: { x: 6218, z: 6908, links: [350, 160, 156] },
  398: { x: 5867, z: 6540, links: [346, 348] },
  399: { x: 5753, z: 6503, links: [347, 345, 349] },
  400: { x: 5696, z: 6484, links: [341, 155, 346] },
  401: { x: 6184, z: 6813, links: [349, 345] },
  402: { x: 6286, z: 6925, links: [350, 348, 346] },
  403: { x: 6412, z: 6990, links: [351, 349, 162] },
};

// Named tracks: name → [startJunction, endJunction]
const namedTracks = {
  'A-01-L': [398, 401],
  'A-02-S': [398, 401],
  'A-03-L': [399, 402],
  'B-01-S': [152, 157],
  'B-02-I': [152, 157],
  'B-03-S': [158, 157],
  'B-05-O': [152, 151],
  'B-06-O': [152, 157],
  'B-07-P': [152, 157],
};

// Edges: pairs of connected junctions (from linkedJunctions)
const edges = new Set();
const fmIds = new Set(Object.keys(junctions).map(Number));
for (const [id, j] of Object.entries(junctions)) {
  for (const link of j.links) {
    const a = Math.min(Number(id), link);
    const b = Math.max(Number(id), link);
    edges.add(`${a}-${b}`);
  }
}

// External junctions (referenced but not in FM)
const externalIds = new Set();
for (const j of Object.values(junctions)) {
  for (const l of j.links) {
    if (!fmIds.has(l)) externalIds.add(l);
  }
}

// ============================================================
// LEFT PANEL: Raw geometry rendering
// ============================================================

const rawSvg = document.getElementById('raw');

// Compute bounding box of all junction positions
const allX = Object.values(junctions).map(j => j.x);
const allZ = Object.values(junctions).map(j => j.z);
const minX = Math.min(...allX) - 80;
const maxX = Math.max(...allX) + 80;
const minZ = Math.min(...allZ) - 80;
const maxZ = Math.max(...allZ) + 80;
const rangeX = maxX - minX;
const rangeZ = maxZ - minZ;

function rawToSvg(x, z) {
  const pad = 60;
  const sx = pad + (x - minX) / rangeX * (800 - 2 * pad);
  const sy = pad + (z - minZ) / rangeZ * (600 - 2 * pad);
  return [sx, sy];
}

// Draw edges
for (const edge of edges) {
  const [a, b] = edge.split('-').map(Number);
  const ja = junctions[a];
  const jb = junctions[b];
  if (!ja || !jb) continue; // skip edges to external junctions
  const [x1, y1] = rawToSvg(ja.x, ja.z);
  const [x2, y2] = rawToSvg(jb.x, jb.z);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#666');
  line.classList.add('trk');
  rawSvg.appendChild(line);
}

// Draw junctions
for (const [id, j] of Object.entries(junctions)) {
  const [cx, cy] = rawToSvg(j.x, j.z);
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy);
  c.setAttribute('r', j.links.length > 2 ? 4 : 3);
  c.setAttribute('fill', j.links.length > 2 ? '#c0c0c0' : '#888');
  c.classList.add('jdot');
  rawSvg.appendChild(c);

  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', cx + 6); t.setAttribute('y', cy - 4);
  t.classList.add('jlbl');
  t.textContent = id;
  rawSvg.appendChild(t);
}

// ============================================================
// RIGHT PANEL: Schematic layout engine
// ============================================================
//
// The algorithm:
// 1. Identify the MAIN THROUGH-ROUTE (longest path between external exits)
// 2. Place it as a horizontal line
// 3. Identify PARALLEL YARD TRACKS
// 4. Place them as evenly spaced horizontal lines above/below the main
// 5. Identify BRANCH LOOPS and lay them out symmetrically
// 6. All angles: 0°, 45°, 90° only
//
// For Farm:
// - Main through-route: J-400 → J-155 → J-161 → J-156 → J-162 → J-403
//   (this is the path from external J-341 to external J-351)
// - Upper yard tracks (B-05 to B-07): fan off the main between J-151..J-154
// - Lower yard tracks (B-01 to B-03): fan off the main between J-157..J-158
// - Bottom loop: J-399 → J-398 → J-401 → J-402 (A tracks)

const schSvg = document.getElementById('sch');
const S = {}; // schematic positions: junctionId → [x, y]

// Schematic layout constants
const pad = 60;
const W = 800 - 2 * pad;
const H = 600 - 2 * pad;
const mainY = 300;  // main line y
const trackGap = 28; // vertical gap between parallel tracks

// === STEP 1: Place main through-route horizontally ===
// Main route: 400 → 155 → 161 → 159 → 157  (lower ladder)
//                         └→ 153 → 151 → 152 → 154 → 156  (upper ladder)
//                                                    └→ 160 → 158 (lower right)
//                                        └→ 162 → 403

// Actually from the graph, the main through path is:
// ENTRY(341) → 400 → 155 → 161 → 156 → 162 → 403 → EXIT(351)
// This is the main line passing through the station

const mainRoute = [400, 155, 161, 156, 162, 403];
const mainSpacing = W / (mainRoute.length + 1);

mainRoute.forEach((id, i) => {
  S[id] = [pad + mainSpacing * (i + 1), mainY];
});

// === STEP 2: Place upper yard ladder (B tracks) ===
// The upper ladder runs through: 153, 151, 152, 154
// These are turnouts that fan tracks above the main line
// 153 links to 155 (on main) and 151 and 154
// 154 links to 156 (on main) and 152 and 153

// Place the upper ladder junctions at the same Y as main but offset for turnouts
// 153 is between 155 and 161 on the main, slightly above
// 151 is a pass-through between 153 and 152
// 152 is a pass-through between 151 and 154
// 154 is between 156 and ... on the main, slightly above

const upperY = mainY; // Same y-level as main (they ARE on the main line, they're the turnouts)
// Actually 153 and 154 are turnouts ON the main line
// 151 and 152 are pass-throughs between B-track entry pairs

// Let's space them between J-155 and J-156 on the main line
const x155 = S[155][0];
const x156 = S[156][0];
const yardWidth = x156 - x155;

// Upper turnout junctions (left side of yard)
S[153] = [x155 + yardWidth * 0.12, mainY];
S[159] = [x155 + yardWidth * 0.20, mainY];
S[151] = [x155 + yardWidth * 0.28, mainY];
S[157] = [x155 + yardWidth * 0.36, mainY];

// Upper turnout junctions (right side of yard)
S[158] = [x156 - yardWidth * 0.36, mainY];
S[152] = [x156 - yardWidth * 0.28, mainY];
S[160] = [x156 - yardWidth * 0.20, mainY];
S[154] = [x156 - yardWidth * 0.12, mainY];

// === STEP 3: Place lower loop (A tracks) ===
// J-399 → J-398 → J-401 → J-402
// This is a loop below the main line
// 399 and 400 are near the left entry, 402 and 403 near the right exit
const loopY = mainY + 120;
S[399] = [S[400][0] - 30, mainY + 45];
S[398] = [S[400][0] + 40, loopY];
S[401] = [S[403][0] - 40, loopY];
S[402] = [S[403][0] + 30, mainY + 45];

// === STEP 4: Render schematic ===

// Draw function
function drawLine(svg, x1, y1, x2, y2, color, width) {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', color || '#888');
  l.setAttribute('stroke-width', width || 2);
  l.setAttribute('stroke-linecap', 'round');
  l.setAttribute('fill', 'none');
  svg.appendChild(l);
}

function drawDash(svg, x1, y1, x2, y2) {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', '#555');
  l.setAttribute('stroke-width', 2);
  l.setAttribute('stroke-linecap', 'round');
  l.setAttribute('stroke-dasharray', '6 4');
  l.setAttribute('fill', 'none');
  svg.appendChild(l);
}

function drawLabel(svg, x, y, text, cls) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('text-anchor', 'middle');
  t.classList.add(cls || 'tlbl');
  t.textContent = text;
  svg.appendChild(t);
}

// --- Main line ---
drawDash(schSvg, pad - 30, mainY, S[400][0], mainY);     // entry from left
drawLine(schSvg, S[400][0], mainY, S[403][0], mainY, '#b0b0b0', 3); // main through
drawDash(schSvg, S[403][0], mainY, pad + W + 30, mainY);  // exit right

// --- Upper yard tracks (B tracks) ---
// B-07-P: topmost, from J-153 area to J-154 area
const yardTracks = [
  { name: 'B-07-P', offset: -3 },
  { name: 'B-06-O', offset: -2 },
  { name: 'B-05-O', offset: -1 },
  // main line (offset 0)
  { name: 'B-03-S', offset: 1 },
  { name: 'B-02-I', offset: 2 },
  { name: 'B-01-S', offset: 3 },
];

const yardLeftX = S[153][0];
const yardRightX = S[154][0];
const ladderAngleX = 20; // horizontal run before parallel section

yardTracks.forEach(yt => {
  const y = mainY + yt.offset * trackGap;
  const entryX = yardLeftX + Math.abs(yt.offset) * ladderAngleX;
  const exitX = yardRightX - Math.abs(yt.offset) * ladderAngleX;

  // Left diagonal entry
  drawLine(schSvg, yardLeftX, mainY, entryX, y, '#777', 2);
  // Parallel section
  drawLine(schSvg, entryX, y, exitX, y, '#777', 2);
  // Right diagonal exit
  drawLine(schSvg, exitX, y, yardRightX, mainY, '#777', 2);

  // Label
  drawLabel(schSvg, (entryX + exitX) / 2, y - 5, yt.name, 'jlbl');
});

// --- Lower loop (A tracks) ---
// Left branch: main → 399 → 398
drawLine(schSvg, S[400][0], mainY, S[399][0], S[399][1], '#888', 2);
drawLine(schSvg, S[399][0], S[399][1], S[398][0], S[398][1], '#888', 2);
// A-01-L and A-02-S (parallel)
drawLine(schSvg, S[398][0], loopY, S[401][0], loopY, '#777', 2);
drawLine(schSvg, S[398][0], loopY + trackGap, S[401][0], loopY + trackGap, '#777', 2);
// Right branch: 401 → 402 → main
drawLine(schSvg, S[401][0], S[401][1], S[402][0], S[402][1], '#888', 2);
drawLine(schSvg, S[402][0], S[402][1], S[403][0], mainY, '#888', 2);

// A track labels
drawLabel(schSvg, (S[398][0] + S[401][0]) / 2, loopY - 5, 'A-01-L', 'jlbl');
drawLabel(schSvg, (S[398][0] + S[401][0]) / 2, loopY + trackGap - 5, 'A-02-S', 'jlbl');

// Exit to SW (south from right side)
drawDash(schSvg, S[403][0], mainY, S[403][0], mainY + 80);
drawLabel(schSvg, S[403][0] + 20, mainY + 70, 'to SW', 'exit-lbl');

// --- Junctions (triangles) ---
for (const [id, pos] of Object.entries(S)) {
  const j = junctions[id];
  if (!j) continue;
  const [cx, cy] = pos;
  const isTurnout = j.links.length > 2;

  // Triangle for turnouts, dot for pass-throughs
  if (isTurnout) {
    const tri = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    tri.setAttribute('points', `${cx+7},${cy} ${cx-4},${cy-5} ${cx-4},${cy+5}`);
    tri.setAttribute('fill', '#c0c0c0');
    tri.style.cursor = 'pointer';
    tri.addEventListener('mouseenter', () => tri.setAttribute('fill', '#fff'));
    tri.addEventListener('mouseleave', () => tri.setAttribute('fill', '#c0c0c0'));
    schSvg.appendChild(tri);
  } else {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    c.setAttribute('r', 2.5);
    c.setAttribute('fill', '#888');
    schSvg.appendChild(c);
  }
}

// Station title
drawLabel(schSvg, 400, 40, 'FARM (FM)', 'tlbl');

// Exit labels
drawLabel(schSvg, pad - 10, mainY - 10, 'to OWC', 'exit-lbl');
drawLabel(schSvg, pad + W + 10, mainY - 10, 'to FRC', 'exit-lbl');

// Section labels
drawLabel(schSvg, (yardLeftX + yardRightX) / 2, mainY - 100, 'Transfer Yard B', 'exit-lbl');
drawLabel(schSvg, (S[398][0] + S[401][0]) / 2, loopY + 55, 'Loading Area A', 'exit-lbl');
</script>
</body>
</html>
