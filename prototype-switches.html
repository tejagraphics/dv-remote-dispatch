<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnout Concept Model</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Consolas', 'Monaco', monospace;
    color: #888;
  }
  h1 { font-size: 11px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .hint { font-size: 9px; color: #444; margin-bottom: 20px; }
  svg { display: block; }
  .state { font-size: 11px; color: #999; margin-top: 16px; height: 16px; }
  .state b { color: #ccc; }
</style>
</head>
<body>

<h1>Turnout Concept Model</h1>
<p class="hint">Click the switch point to toggle between THROUGH and DIVERGE</p>

<svg id="turnout" width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="350" fill="#141414"/>

  <!--
    A railway turnout has THREE tracks meeting at ONE point:

    1. APPROACH — the track the train arrives on
    2. THROUGH — the straight-ahead continuation
    3. DIVERGING — the branching route

    The switch point (●) is where these three meet.
    The triangle indicator sits AT this point.

    When set to THROUGH:
      approach + through = ACTIVE (bright)
      diverging = INACTIVE (dim)
      triangle points along through direction

    When set to DIVERGE:
      approach + diverging = ACTIVE (bright)
      through = INACTIVE (dim)
      triangle points along diverging direction

    The triangle is PART OF the switch point.
    It does NOT float on a track.
    It does NOT mark a node.
    It indicates WHICH of the two exits is currently selected.
  -->

  <!-- APPROACH TRACK: comes from the left, always active -->
  <line id="approach" x1="50" y1="200" x2="320" y2="200"
        stroke="#b0b0b0" stroke-width="3" stroke-linecap="round"/>

  <!-- THROUGH TRACK: continues straight right from the switch point -->
  <line id="through" x1="350" y1="200" x2="650" y2="200"
        stroke="#b0b0b0" stroke-width="3" stroke-linecap="round"/>

  <!-- DIVERGING TRACK: branches up-right from the switch point -->
  <line id="diverge" x1="345" y1="195" x2="600" y2="80"
        stroke="#333" stroke-width="3" stroke-linecap="round"/>

  <!--
    SWITCH POINT: the exact location where approach meets the two routes.
    This is where the triangle sits.
    The triangle IS the switch indicator — it shows which route is selected.
  -->

  <!-- Triangle indicator at the switch point -->
  <!-- It sits right at the junction of the three tracks -->
  <!-- Currently pointing RIGHT (along the through route) -->
  <g id="indicator" style="cursor:pointer" transform="rotate(0, 335, 200)">
    <!-- Small solid triangle — tip points along selected route -->
    <polygon id="tri" points="347,200 328,192 328,208" fill="#c8c8c8"/>
  </g>

  <!-- Labels -->
  <text x="120" y="225" fill="#555" font-size="10" font-family="Consolas,Monaco,monospace">APPROACH</text>
  <text id="lbl-through" x="500" y="225" fill="#777" font-size="10" font-family="Consolas,Monaco,monospace">THROUGH</text>
  <text id="lbl-diverge" x="520" y="72" fill="#444" font-size="10" font-family="Consolas,Monaco,monospace">DIVERGING</text>

  <!-- Switch point dot (the physical pivot) -->
  <circle cx="335" cy="200" r="2" fill="#888" id="pivot"/>
</svg>

<div class="state" id="stateLabel">State: <b>THROUGH</b></div>

<script>
const indicator = document.getElementById('indicator');
const throughLine = document.getElementById('through');
const divergeLine = document.getElementById('diverge');
const lblThrough = document.getElementById('lbl-through');
const lblDiverge = document.getElementById('lbl-diverge');
const stateLabel = document.getElementById('stateLabel');
const pivot = document.getElementById('pivot');

// Switch point position
const PX = 335, PY = 200;

// Route angles (in SVG coordinate space)
// Through: straight right = 0°
// Diverging: up-right = angle toward (600, 80) from (335, 200)
const throughAngle = 0;
const divergeAngle = Math.atan2(80 - 200, 600 - 335) * 180 / Math.PI; // ≈ -24.6°

let state = 0; // 0 = through, 1 = diverge
let animating = false;

const ease = t => 1 - Math.pow(1 - t, 3);

function setVisualState(throughActive) {
  // Active route = bright, inactive = dim
  if (throughActive) {
    throughLine.setAttribute('stroke', '#b0b0b0');
    divergeLine.setAttribute('stroke', '#333');
    lblThrough.setAttribute('fill', '#777');
    lblDiverge.setAttribute('fill', '#333');
    stateLabel.innerHTML = 'State: <b>THROUGH</b>';
  } else {
    throughLine.setAttribute('stroke', '#333');
    divergeLine.setAttribute('stroke', '#b0b0b0');
    lblThrough.setAttribute('fill', '#333');
    lblDiverge.setAttribute('fill', '#777');
    stateLabel.innerHTML = 'State: <b>DIVERGE</b>';
  }
}

indicator.addEventListener('click', () => {
  if (animating) return;
  animating = true;

  const newState = 1 - state;
  const fromAngle = state === 0 ? throughAngle : divergeAngle;
  const toAngle = newState === 0 ? throughAngle : divergeAngle;
  state = newState;

  // Update track brightness at the start of the animation
  setVisualState(state === 0);

  const t0 = performance.now();

  function frame(now) {
    const raw = Math.min((now - t0) / 300, 1);
    const e = ease(raw);
    const angle = fromAngle + (toAngle - fromAngle) * e;
    indicator.setAttribute('transform', `rotate(${angle}, ${PX}, ${PY})`);

    if (raw < 1) {
      requestAnimationFrame(frame);
    } else {
      indicator.setAttribute('transform', `rotate(${toAngle}, ${PX}, ${PY})`);
      animating = false;
    }
  }
  requestAnimationFrame(frame);
});

// Hover feedback
const tri = document.getElementById('tri');
indicator.addEventListener('mouseenter', () => tri.setAttribute('fill', '#eee'));
indicator.addEventListener('mouseleave', () => tri.setAttribute('fill', '#c8c8c8'));
</script>
</body>
</html>
