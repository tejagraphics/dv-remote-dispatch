const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${D.svgW} ${D.svgH}`);

const ACTIVE = '#a0a0a0';
const INACTIVE = '#282828';
const ease = t => 1 - Math.pow(1-t, 3);

// --- Render tracks ---
D.paths.forEach(t => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', t.d);
  p.setAttribute('stroke', ACTIVE);
  p.setAttribute('stroke-width', '2');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(p);
});

// --- Render switches ---
// Each switch gets ONE small triangle at the exact turnout point.
// Triangle points along the THROUGH direction by default (state=0).
// Click to toggle to DIVERGE direction (state=1).
// Active route stays bright, inactive route dims.
// Triangle is SMALL relative to tracks — just an indicator, not covering geometry.

const TL = 7;   // triangle tip length from center
const TW = 4.5; // triangle half-width at base

const switches = D.switches.map(s => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  // Initial rotation: through direction
  g.setAttribute('transform', `rotate(${s.through_deg}, ${s.x}, ${s.y})`);
  g.style.cursor = 'pointer';

  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  // Small arrowhead: tip points along the selected route direction
  poly.setAttribute('points',
    `${s.x+TL},${s.y} ${s.x-TL*0.15},${s.y-TW} ${s.x-TL*0.15},${s.y+TW}`);
  poly.setAttribute('fill', '#c8c8c8');
  poly.style.transition = 'fill 120ms';
  g.appendChild(poly);

  g.addEventListener('mouseenter', () => poly.setAttribute('fill', '#fff'));
  g.addEventListener('mouseleave', () => poly.setAttribute('fill', '#c8c8c8'));

  svg.appendChild(g);

  return { ...s, el: g, state: 0, animating: false };
});

document.getElementById('nSw').textContent = switches.length;
const actEl = document.getElementById('act');

// --- Click to toggle ---
switches.forEach(sw => {
  sw.el.addEventListener('click', () => {
    if (sw.animating) return;
    sw.animating = true;
    const from = sw.state === 0 ? sw.through_deg : sw.diverge_deg;
    const to = sw.state === 0 ? sw.diverge_deg : sw.through_deg;
    sw.state = 1 - sw.state;
    const t0 = performance.now();
    actEl.textContent = `J-${sw.id} → ${sw.state === 0 ? 'THROUGH' : 'DIVERGE'}`;
    (function frame(now) {
      const r = Math.min((now - t0) / 300, 1);
      const a = from + (to - from) * ease(r);
      sw.el.setAttribute('transform', `rotate(${a}, ${sw.x}, ${sw.y})`);
      if (r < 1) requestAnimationFrame(frame);
      else { sw.el.setAttribute('transform', `rotate(${to}, ${sw.x}, ${sw.y})`); sw.animating = false; }
    })(performance.now());
  });
});

// --- Pan & Zoom ---
let vb = {x:0, y:0, w:D.svgW, h:D.svgH};
let pan = false, ps = {x:0, y:0};
function setVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
svg.addEventListener('mousedown', e => {
  if (e.target.closest('g')) return;
  pan = true; ps = {x: e.clientX, y: e.clientY};
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  vb.x -= (e.clientX - ps.x) * vb.w / svg.clientWidth;
  vb.y -= (e.clientY - ps.y) * vb.h / svg.clientHeight;
  ps = {x: e.clientX, y: e.clientY};
  setVB();
});
window.addEventListener('mouseup', () => pan = false);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.1 : 0.9;
  const r = svg.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width;
  const my = (e.clientY - r.top) / r.height;
  const nw = vb.w * f, nh = vb.h * f;
  vb.x += (vb.w - nw) * mx;
  vb.y += (vb.h - nh) * my;
  vb.w = nw; vb.h = nh;
  setVB();
}, {passive: false});
