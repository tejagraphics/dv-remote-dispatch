  yard:      { stroke: '#777', width: 2 },

  through:   { stroke: '#555', width: 1.5 },

// ================================================================
// Render tracks into an SVG element
// ================================================================
function renderTracks(svgEl) {
  svgEl.setAttribute('viewBox', `0 0 ${FM.w} ${FM.h}`);
  // Background
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', FM.w); bg.setAttribute('height', FM.h);
  bg.setAttribute('fill', '#141414');
  svgEl.appendChild(bg);

  FM.tracks.forEach(t => {
    const s = STYLE[t.cat] || { stroke: '#555', width: 1.5 };
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', t.d);
    p.setAttribute('stroke', s.stroke);
    p.setAttribute('stroke-width', s.width);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    svgEl.appendChild(p);
  });
}

// ================================================================
// Render switch indicators into an SVG element
// ================================================================
function renderSwitches(svgEl) {
  const TL = 6;   // tip distance from center
  const TW = 3.5; // half-width at base
  const ease = t => 1 - Math.pow(1-t, 3);
  const actEl = document.getElementById('act');

  FM.switches.forEach(sw => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `rotate(${sw.tDeg}, ${sw.x}, ${sw.y})`);
    g.style.cursor = 'pointer';

    // Small filled triangle
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points',
      `${sw.x+TL},${sw.y} ${sw.x-TL*0.15},${sw.y-TW} ${sw.x-TL*0.15},${sw.y+TW}`);
    poly.setAttribute('fill', '#c0c0c0');
    poly.style.transition = 'fill 120ms';
    g.appendChild(poly);

    // Hover
    g.addEventListener('mouseenter', () => poly.setAttribute('fill', '#eee'));
    g.addEventListener('mouseleave', () => poly.setAttribute('fill', '#c0c0c0'));

    svgEl.appendChild(g);

    // State
    let state = 0;
    let animating = false;

    g.addEventListener('click', () => {
      if (animating) return;
      animating = true;
      const from = state === 0 ? sw.tDeg : sw.dDeg;
      const to = state === 0 ? sw.dDeg : sw.tDeg;
      state = 1 - state;
      const t0 = performance.now();
      actEl.textContent = `J-${sw.id} → ${state === 0 ? 'THROUGH' : 'DIVERGE'}`;
      (function frame(now) {
        const r = Math.min((now - t0) / 300, 1);
        const a = from + (to - from) * ease(r);
        g.setAttribute('transform', `rotate(${a}, ${sw.x}, ${sw.y})`);
        if (r < 1) requestAnimationFrame(frame);
        else { g.setAttribute('transform', `rotate(${to}, ${sw.x}, ${sw.y})`); animating = false; }
      })(performance.now());
    });
  });
}

// ================================================================
// Pan & zoom for both panels (synchronized)
// ================================================================

const svgB = document.getElementById('svgB');

renderTracks(svgA);
renderTracks(svgB);
renderSwitches(svgB); // Only panel B gets indicators

let vb = {x: 0, y: 0, w: FM.w, h: FM.h};
function setVB() {
  const v = `${vb.x} ${vb.y} ${vb.w} ${vb.h}`;
  svgA.setAttribute('viewBox', v);
  svgB.setAttribute('viewBox', v);
}

let pan = false, ps = {x:0, y:0}, panSvg = null;

document.querySelectorAll('svg').forEach(s => {
  s.addEventListener('mousedown', e => {
    if (e.target.closest('g')) return;
    pan = true; ps = {x: e.clientX, y: e.clientY}; panSvg = s;
  });
});

window.addEventListener('mousemove', e => {
  if (!pan) return;
  const r = panSvg.getBoundingClientRect();
  vb.x -= (e.clientX - ps.x) * vb.w / r.width;
  vb.y -= (e.clientY - ps.y) * vb.h / r.height;
  ps = {x: e.clientX, y: e.clientY};
  setVB();
});
window.addEventListener('mouseup', () => pan = false);

document.querySelectorAll('svg').forEach(s => {
  s.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY > 0 ? 1.1 : 0.9;
    const r = s.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width;
    const my = (e.clientY - r.top) / r.height;
    vb.w *= f; vb.h *= f;
    vb.x += vb.w * (1 - f) * mx / f;
    vb.y += vb.h * (1 - f) * my / f;
    setVB();
  }, {passive: false});
});
