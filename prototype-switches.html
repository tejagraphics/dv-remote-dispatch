const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${FM.w} ${FM.h}`);

const ACTIVE = '#a0a0a0';
const INACTIVE = '#2a2a2a';
const TRACK_BG = '#666';     // background tracks (non-switch)
const TRACK_BG_W = 2;
const SWITCH_W = 2;          // switch segment stroke width
const TRI_TIP = 6;           // triangle tip distance from anchor
const TRI_HW = 3.5;          // triangle half-width at base
const ease = t => 1 - Math.pow(1-t, 3);
const actEl = document.getElementById('act');
const debugEl = document.getElementById('debug');
const debugContent = document.getElementById('debugContent');

// ================================================================
// LAYER 1: Background tracks (non-switch segments)
// These never change visual state — they are the static railway
// ================================================================

FM.tracks.forEach(t => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', t.d);
  p.setAttribute('stroke', TRACK_BG);
  p.setAttribute('stroke-width', TRACK_BG_W);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(p);
});

// ================================================================
// LAYER 2: Switch segments (through + diverge paths)
// Each has an ID so we can change its color when the switch toggles
// ================================================================

const switchPathEls = {};

FM.throughPaths.forEach(t => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', t.d);
  p.setAttribute('id', t.id);
  p.setAttribute('stroke', ACTIVE);  // through starts active
  p.setAttribute('stroke-width', SWITCH_W);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  p.style.transition = 'stroke 200ms ease';
  svg.appendChild(p);
  switchPathEls[t.id] = p;
});

FM.divergePaths.forEach(t => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', t.d);
  p.setAttribute('id', t.id);
  p.setAttribute('stroke', INACTIVE);  // diverge starts inactive
  p.setAttribute('stroke-width', SWITCH_W);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  p.style.transition = 'stroke 200ms ease';
  svg.appendChild(p);
  switchPathEls[t.id] = p;
});

// ================================================================
// LAYER 3: Turnout indicators
// One small triangle per physical turnout, anchored at the switch point
// ================================================================

const turnoutState = {};

FM.turnouts.forEach(sw => {
  turnoutState[sw.id] = { state: 0, animating: false };

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `rotate(${sw.tDeg}, ${sw.x}, ${sw.y})`);
  g.style.cursor = 'pointer';

  // Small triangle: tip points along selected route
  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute('points',
    `${sw.x+TRI_TIP},${sw.y} ${sw.x-TRI_TIP*0.15},${sw.y-TRI_HW} ${sw.x-TRI_TIP*0.15},${sw.y+TRI_HW}`);
  poly.setAttribute('fill', '#c0c0c0');
  poly.style.transition = 'fill 120ms';
  g.appendChild(poly);

  // Hover
  g.addEventListener('mouseenter', () => {
    poly.setAttribute('fill', '#eee');
    showDebug(sw);
  });
  g.addEventListener('mouseleave', () => {
    poly.setAttribute('fill', '#c0c0c0');
  });

  // Click: toggle switch state
  g.addEventListener('click', () => {
    const ts = turnoutState[sw.id];
    if (ts.animating) return;
    ts.animating = true;

    const oldState = ts.state;
    const newState = 1 - oldState;
    ts.state = newState;

    const fromAngle = oldState === 0 ? sw.tDeg : sw.dDeg;
    const toAngle = newState === 0 ? sw.tDeg : sw.dDeg;

    // Update track segment colors
    const tEl = switchPathEls[sw.tPathId];
    const dEl = switchPathEls[sw.dPathId];
    if (tEl) tEl.setAttribute('stroke', newState === 0 ? ACTIVE : INACTIVE);
    if (dEl) dEl.setAttribute('stroke', newState === 1 ? ACTIVE : INACTIVE);

    actEl.textContent = `J-${sw.id} → ${newState === 0 ? 'THROUGH' : 'DIVERGE'}`;
    showDebug(sw);

    // Animate indicator rotation
    const t0 = performance.now();
    (function frame(now) {
      const r = Math.min((now - t0) / 300, 1);
      const a = fromAngle + (toAngle - fromAngle) * ease(r);
      g.setAttribute('transform', `rotate(${a}, ${sw.x}, ${sw.y})`);
      if (r < 1) requestAnimationFrame(frame);
      else {
        g.setAttribute('transform', `rotate(${toAngle}, ${sw.x}, ${sw.y})`);
        ts.animating = false;
      }
    })(performance.now());
  });

  svg.appendChild(g);
});

// ================================================================
// DEBUG PANEL
// ================================================================

let debugVisible = false;
document.addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') {
    debugVisible = !debugVisible;
    debugEl.style.display = debugVisible ? 'block' : 'none';
  }
});

function showDebug(sw) {
  if (!debugVisible) return;
  const ts = turnoutState[sw.id];
  debugContent.innerHTML = `
    <div class="row">Turnout ID: <b>J-${sw.id}</b></div>
    <div class="row">Anchor: <b>(${sw.x.toFixed(0)}, ${sw.y.toFixed(0)})</b> SVG coords</div>
    <div class="row">Through angle: <b>${sw.tDeg.toFixed(1)}°</b></div>
    <div class="row">Diverge angle: <b>${sw.dDeg.toFixed(1)}°</b></div>
    <div class="row">Split angle: <b>${Math.abs(sw.dDeg - sw.tDeg).toFixed(1)}°</b></div>
    <div class="row">State: <b>${ts.state === 0 ? 'THROUGH' : 'DIVERGE'}</b></div>
    <div class="row">Through path: <b>${sw.tPathId}</b></div>
    <div class="row">Diverge path: <b>${sw.dPathId}</b></div>
  `;
}

// ================================================================
// PAN & ZOOM
// ================================================================

let vb = {x: 0, y: 0, w: FM.w, h: FM.h};
let pan = false, ps = {x:0, y:0};
function setVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

svg.addEventListener('mousedown', e => {
  if (e.target.closest('g')) return;
  pan = true; ps = {x: e.clientX, y: e.clientY};
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  const r = svg.getBoundingClientRect();
  vb.x -= (e.clientX - ps.x) * vb.w / r.width;
  vb.y -= (e.clientY - ps.y) * vb.h / r.height;
  ps = {x: e.clientX, y: e.clientY};
  setVB();
});
window.addEventListener('mouseup', () => pan = false);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.1 : 0.9;
  const r = svg.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width;
  const my = (e.clientY - r.top) / r.height;
  const nw = vb.w * f, nh = vb.h * f;
  vb.x += (vb.w - nw) * mx;
  vb.y += (vb.h - nh) * my;
  vb.w = nw; vb.h = nh;
  setVB();
}, {passive: false});
</script>
</body>
