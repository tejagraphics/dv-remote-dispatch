<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Derail Valley Remote Dispatch</title>
  <link rel="icon" href="res/icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.css" integrity="sha256-BPfK9M5v34c2XP6p0cxVz1mUQLst0gTLk0mlc7kuodA=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/css/leaflet-sidebar.min.css" integrity="sha256-10dwwxs/pdWEYoC56aJvmY3kbMMa9/3uSWWNkGcrGq8=" crossorigin="anonymous">
  <link rel="stylesheet" href="res/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/js/all.min.js" integrity="sha256-gSqw5G+Gss6YqyQlqyIkuQ0IRZUqGsDVq9c0tiF+mL8=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet-src.js" integrity="sha256-dG7rUAec0UN0e3nlMEuYJzsbK0rpoz4hBbNp0ir9iF8=" crossorigin="anonymous"></script>
  <script src="res/leaflet.rotatedImageOverlay.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-sidebar-v2@3.2.3/js/leaflet-sidebar.min.js" integrity="sha256-4r81BYKeNxSG+nrK/UPQq75pDlH+GkiZn/zc/xkNMLA=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zerowastemap/leaflet.zoomhome@1.0.0/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tablesort@5.2.1/src/tablesort.js" integrity="sha256-ams/0yjSE7HGIRWB/A3VtW3Z24eOT+5z0z9d1pms7T4=" crossorigin="anonymous"></script>
</head>
<body>

<!-- Connection status indicator -->
<div id="connectionStatus" class="connection-status connected" title="Connected">
  <i class="fas fa-wifi"></i>
</div>

<div id="sidebar" class="leaflet-sidebar collapsed">
  <div class="leaflet-sidebar-tabs">
    <ul role="tablist">
      <li><a href="#carsTab" role="tab"><i class="fas fa-train" title="Cars"></i></a></li>
      <li><a href="#jobsTab" role="tab"><i class="fas fa-clipboard-list" title="Jobs"></i></a></li>
      <li><a href="#locoControlTab" role="tab"><i class="fas fa-gamepad" title="Loco Control"></i></a></li>
      <li><a href="#settingsTab" role="tab"><i class="fas fa-cog" title="Settings"></i></a></li>
    </ul>
  </div>
  <div class="leaflet-sidebar-content">

    <!-- Cars Tab -->
    <div class="leaflet-sidebar-pane" id="carsTab">
      <h2 class="sidebar-heading"><i class="fas fa-train"></i> Rolling Stock</h2>
      <div class="car-stats">
        <span id="carCount" class="stat-badge">0 cars</span>
        <span id="locoCount" class="stat-badge stat-badge-loco">0 locos</span>
      </div>
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input id="carSearchText" type="text" placeholder="Filter cars...">
      </div>
      <table id="carList" class="data-table">
        <thead>
          <tr><th>ID</th><th>Job</th><th>Dest</th></tr>
        </thead>
        <tbody id="carListBody"></tbody>
      </table>
    </div>

    <!-- Jobs Tab -->
    <div class="leaflet-sidebar-pane" id="jobsTab">
      <h2 class="sidebar-heading"><i class="fas fa-clipboard-list"></i> Jobs</h2>
      <div class="job-stats">
        <span id="jobCount" class="stat-badge">0 jobs</span>
        <span id="activeJobCount" class="stat-badge stat-badge-active">0 active</span>
      </div>
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input id="jobSearchText" type="text" placeholder="Search jobs...">
      </div>
      <label class="checkbox-label">
        <input id="jobActiveOnly" type="checkbox">
        <span>Active only</span>
      </label>
      <table id="jobList" class="data-table">
        <tbody id="jobListBody"></tbody>
      </table>
    </div>

    <!-- Loco Control Tab -->
    <div class="leaflet-sidebar-pane" id="locoControlTab">
      <h2 class="sidebar-heading"><i class="fas fa-gamepad"></i> Locomotive Control</h2>

      <div class="loco-selector">
        <label for="locoControlLocoId">Locomotive</label>
        <div class="loco-select-wrapper">
          <span class="loco-prefix">L-</span>
          <select id="locoControlLocoId"></select>
        </div>
      </div>

      <div class="loco-gauges">
        <div class="gauge">
          <div class="gauge-label">Speed</div>
          <div class="gauge-value"><span id="locoControlForwardSpeed">--</span> <small>km/h</small></div>
        </div>
        <div class="gauge">
          <div class="gauge-label">Brake Pipe</div>
          <div class="gauge-value"><span id="locoControlBrakePipe">--</span> <small>bar</small></div>
        </div>
        <div class="gauge" id="slipIndicatorGauge">
          <div class="gauge-label">Wheelslip</div>
          <div class="gauge-value" id="slipIndicator">—</div>
        </div>
      </div>

      <div id="locoControlControls" class="loco-controls">
        <div class="control-row">
          <label for="locoControlThrottleInput">Throttle</label>
          <input id="locoControlThrottleInput" type="range" min="0" max="100" value="0" class="range-throttle">
          <span class="range-value" id="throttleValue">0%</span>
        </div>
        <div class="control-row">
          <label>Reverser</label>
          <div class="reverser-buttons">
            <button id="locoControlReverserReverseButton" class="reverser-btn" locoControlCommand="reverse" title="Reverse">
              <i class="far fa-play-circle fa-flip-horizontal"></i> REV
            </button>
            <span id="reverserIndicator" class="reverser-indicator">N</span>
            <button id="locoControlReverserForwardButton" class="reverser-btn" locoControlCommand="forward" title="Forward">
              FWD <i class="far fa-play-circle"></i>
            </button>
          </div>
        </div>
        <div class="control-row">
          <label for="locoControlTrainBrakeInput">Train Brake</label>
          <input id="locoControlTrainBrakeInput" type="range" min="0" max="100" value="0" class="range-brake">
          <span class="range-value" id="trainBrakeValue">0%</span>
        </div>
        <div class="control-row">
          <label for="locoControlIndependentBrakeInput">Indep Brake</label>
          <input id="locoControlIndependentBrakeInput" type="range" min="0" max="100" value="0" class="range-brake">
          <span class="range-value" id="indepBrakeValue">0%</span>
        </div>
        <div class="coupling-controls">
          <button id="locoControlCoupleButton" class="btn btn-couple" title="Couple nearby car">
            <i class="fas fa-link"></i> Couple
          </button>
          <div class="uncouple-group">
            <button id="locoControlUncoupleButton" class="btn btn-uncouple" title="Uncouple">
              <i class="fas fa-unlink"></i> Uncouple
            </button>
            <select id="locoControlUncoupleSelect"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="leaflet-sidebar-pane" id="settingsTab">
      <h2 class="sidebar-heading"><i class="fas fa-cog"></i> Settings</h2>
      <div class="settings-group">
        <div class="setting-row">
          <label for="themeDropdown">Theme</label>
          <select name="theme" id="themeDropdown" class="setting-select">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="carColorDropdown">Car Color</label>
          <select name="carColor" id="carColorDropdown" class="setting-select">
            <option value="jobId">by Job ID</option>
            <option value="jobType">by Job Type</option>
            <option value="destination">by Destination</option>
            <option value="carType">by Car Type</option>
          </select>
        </div>
      </div>
      <div class="settings-about">
        <p>Remote Dispatch for Derail Valley</p>
        <p class="text-muted">Click junctions on the map to toggle them</p>
      </div>
    </div>

  </div>
</div>

<div id="map" class="dark"></div>

<!-- Minimap -->
<div id="minimap" title="Click to navigate">
  <canvas id="minimapCanvas"></canvas>
  <div id="minimapViewport"></div>
</div>

<script src="res/main.js"></script>
</body>
</html>
